# Example wtd config file.
#
# Default location: $XDG_CONFIG_HOME/wtcockpit/config.toml, falling back to
# ~/.config/wtcockpit/config.toml. Override with `wtd -config /path/to/file`.
#
# Precedence: explicit command-line flags > this file > wtd's built-in
# defaults. A flag you actually pass on the command line always wins; a value
# you leave unset here falls back to wtd's built-in default.
#
# Every key below is optional — an absent file, or an absent key within it,
# means "use the built-in default" for that setting. Unknown/misspelled keys
# are a hard error at load time (better than a guardrail rule silently never
# firing because of a typo).

# Root directories to scan for repos. Repeats the effect of one or more
# `-root` flags. An explicit `-root` on the command line replaces this list
# entirely rather than merging with it.
roots = ["~/code", "~/work"]

# Default diff baseline branch for every repo, used when a repo has no
# per-repo override below and wtd can't otherwise detect its default branch.
base = "main"

# Daemon options — same meaning as their same-named flags. Unlike `roots`,
# these are used as-is (no "~" expansion), so spell out the full path.
socket = "/Users/nav/.wtcockpit/wtd.sock"
tcp = ""                 # e.g. "127.0.0.1:7799" to also listen on TCP
web = ""                 # e.g. "127.0.0.1:7788" for the opt-in web reading room;
                         # must be loopback (127.0.0.0/8, ::1, or "localhost") —
                         # anything else refuses to start (remote access is v0.7)
# Default is a SQLite-backed "*.db": the first time it's created, a legacy
# state.json sitting alongside it is imported once (review marks + comments)
# and renamed to state.json.imported. Point this at a "*.json" path instead
# to keep running the pre-v0.6 JSON store, unchanged.
state = "/Users/nav/.wtcockpit/state.db"
interval = "2s"          # poll interval / fsnotify reconciliation tick
watch = "fsnotify"       # "fsnotify" (default) or "poll"

# Per-repo base branch override. Key is the repo's absolute path; only repos
# that need something other than the global `base` above need an entry.
[repos."/Users/nav/code/api-server"]
base = "develop"

# Guardrail rules. If this section is present at all — even with a single
# rule, as here — it REPLACES the built-in default rule set entirely (an
# append-only scheme would make the defaults un-disableable). Omit [[rules]]
# altogether to keep the built-in defaults (twelve rules — see README.md's
# "Guardrails" section for the full list). Fields match guardrail.Rule; the
# one below is copied straight from the built-in defaults. A rule sets
# per-file conditions (path_glob/path_globs, exclude_globs, status, binary,
# min_net_deleted, min_changed_lines, added_pattern, min_token_entropy +
# min_token_len) OR worktree-wide ones (min_delete_add_ratio,
# min_files_changed, min_total_changed) — never both; Compile rejects the mix
# at load, along with any other bad rule (unknown severity, a non-compiling
# added_pattern, entropy without a token-length floor).
[[rules]]
name = "touches-migrations"
severity = "danger"          # "warn" | "danger"
message = "touches database migrations"
path_glob = "**/migrations/**"

# For per-repo tuning instead of replacing the whole set above, use a
# checked-in .wtcockpit.toml at a repo's root (NOT this file) — see README.md's
# "Per-repo overrides" section for its shape, precedence, and trust model.
# `wt rules <id>` shows the fully-resolved set with provenance.

# Desktop notifications on a danger-severity guardrail hit (osascript on
# macOS, notify-send on Linux; absent this table = enabled with these
# defaults). See README.md's "Notifications" section.
[notifications]
enabled  = true      # default true; an absent [notifications] table also means enabled
severity = "danger"  # "danger" (default) | "warn" (= warn + danger)
cooldown = "10m"      # per-(worktree,rule,file) re-notify suppression
